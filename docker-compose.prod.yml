services:
  app:
    build: .
    env_file: .env.prod
    container_name: lolcooldown-app
    restart: unless-stopped
    ports:
      - "8082:3000"
    environment:
      - DATABASE_URL=postgresql://lolcd:${DB_PASSWORD}@postgres:5432/lolcooldown
      - NODE_ENV=production
    volumes:
      # Shared with the seed service so newly seeded images are served without a rebuild
      - images:/app/public/images
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lolcooldown

  # One-off: refresh champions, abilities and skins from Community Dragon.
  #   docker compose --env-file .env.prod -f docker-compose.prod.yml --profile tools run --rm seed
  seed:
    build:
      context: .
      target: builder
    profiles: [tools]
    command: ["npx", "tsx", "src/scripts/seed.ts"]
    environment:
      - DATABASE_URL=postgresql://lolcd:${DB_PASSWORD}@postgres:5432/lolcooldown
    volumes:
      - images:/app/public/images
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lolcooldown

  postgres:
    image: postgres:16-alpine
    container_name: lolcooldown-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lolcd
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: lolcooldown
    ports:
      # Loopback only: the app reaches Postgres over the compose network;
      # this mapping exists only for host-side tools.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lolcd -d lolcooldown"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lolcooldown

volumes:
  postgres_data:
  images:

networks:
  lolcooldown:
    driver: bridge
